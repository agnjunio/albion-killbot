# Reverse proxy config for the api host, manually installed at
# /etc/nginx/sites-enabled/albion-killbot.com — not deployed by any
# automation (nginx isn't containerized here). Kept here as the source of
# truth / disaster-recovery reference for rebuilding the host; if you change
# it on the host, mirror the change back into this file.
limit_req_zone $binary_remote_addr zone=aklimit:10m rate=30r/m;
limit_req_status 429;

limit_conn_zone $binary_remote_addr zone=akconn:10m;

proxy_cache_path /var/cache/albion-killbot keys_zone=akcache:10m loader_threshold=300 loader_files=200;
proxy_cache_valid 200 302 15m;
proxy_cache_valid 404      1m;

# HTTPS server
server {
    # rate limit
    limit_conn akconn 10;
    limit_req zone=aklimit burst=9 delay=5;

    # close slow connections
    client_body_timeout 5s;
    client_header_timeout 5s;

    # www redirect
    server_name albion-killbot.com www.albion-killbot.com;
    if ($host = www.albion-killbot.com) {
        return 301 https://albion-killbot.com$request_uri;
    }

    root /home/albion-killbot/www;
    index index.html;

    proxy_set_header X-Forwarded-Proto $scheme;
    location /api/ {
      add_header X-Cache-Status $upstream_cache_status;

      proxy_cache akcache;
      proxy_pass http://localhost:3000;

      rewrite /api(.*) $1 break;
    }

    location / {
      try_files $uri /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/albion-killbot.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/albion-killbot.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP-HTTPS redirect server
server {
    limit_conn akconn 10;
    limit_req zone=aklimit burst=3;

    if ($host = albion-killbot.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;

    server_name albion-killbot.com www.albion-killbot.com;
    return 404; # managed by Certbot
}
